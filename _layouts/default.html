<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/png" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FCFAF8;
      --surface: #F4F1EE;
      --text: #1A1714;
      --muted: #6B6560;
      --border: #E9E4DF;
      --link: #2563A8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15120F;
        --surface: #1F1C1A;
        --text: #F5F2EE;
        --muted: #A8A29C;
        --border: #2E2B28;
        --link: #8DBBF0;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .wrap { max-width: 46rem; margin: 0 auto; padding: 0 16px; }
    .site-header { border-bottom: 1px solid var(--border); }
    .site-header .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 700; font-size: 1.1rem; text-decoration: none; }
    .brand img { width: 34px; height: 34px; border-radius: 8px; }
    .site-nav { margin-left: auto; display: flex; gap: 18px; font-size: .95rem; }
    .site-nav a { color: var(--muted); text-decoration: none; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--text); }
    main { padding-top: 32px; padding-bottom: 48px; }
    h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 8px; }
    h2 { font-size: 1.3rem; line-height: 1.3; margin: 36px 0 10px; }
    h3 { font-size: 1.1rem; margin: 24px 0 8px; }
    p, ul, ol { margin: 0 0 16px; }
    ul, ol { padding-left: 1.4em; }
    li { margin: 6px 0; }
    a { color: var(--link); text-underline-offset: 2px; }
    h1 + p em { color: var(--muted); font-style: normal; font-size: .95rem; }
    table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 0 0 20px; font-size: .94rem; line-height: 1.5; }
    th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--border); min-width: 8rem; }
    th { background: var(--surface); font-weight: 600; }
    /* On phones, each table row reads as a card, its cells labelled with
       their column (labels added by the script at the end). */
    @media (max-width: 640px) {
      table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
      table.stack { overflow: visible; }
      table.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      table.stack tr { border: 1px solid var(--border); border-radius: 12px; padding: 4px 14px; margin: 0 0 12px; }
      table.stack td { border: 0; padding: 8px 0; min-width: 0; }
      table.stack td + td { border-top: 1px solid var(--border); }
      table.stack td:first-child { font-size: 1rem; }
      table.stack td + td::before { content: attr(data-label); display: block; color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 2px; }
    }
    .site-footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem; }
    .site-footer .wrap { display: flex; flex-wrap: wrap; gap: 6px 20px; padding-top: 18px; padding-bottom: 28px; }
    .site-footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="34" height="34">Therma</a>
      <nav class="site-nav" aria-label="Pages">
        <a href="{{ '/privacy' | relative_url }}"{% if page.url == '/privacy' %} aria-current="page"{% endif %}>Privacy</a>
        <a href="{{ '/terms' | relative_url }}"{% if page.url == '/terms' %} aria-current="page"{% endif %}>Terms</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
{{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ site.time | date: '%Y' }} Iterloop</span>
      <a href="mailto:admin@iterloop.dev">admin@iterloop.dev</a>
    </div>
  </footer>
  <script>
    // Label each table cell with its column so phones can show rows as cards.
    document.querySelectorAll('main table').forEach(function (table) {
      var heads = Array.prototype.map.call(table.querySelectorAll('thead th'), function (th) {
        return th.textContent.trim();
      });
      table.querySelectorAll('tbody tr').forEach(function (row) {
        Array.prototype.forEach.call(row.children, function (cell, i) {
          if (heads[i]) cell.setAttribute('data-label', heads[i]);
        });
      });
      table.classList.add('stack');
    });
  </script>
</body>
</html>
